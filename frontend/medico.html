<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atención Médica - Hospital de Especialidades Portoviejo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="medico.css">
</head>
<body>

    <header class="topbar">
        <div class="institucion">
            <div class="logo-container">
                <img src="logo-hospital.png" alt="Hospital de Especialidades de Jipijapa" class="logo-img">
            </div>
            <div class="info-hospital">
                <h1>Hospital de Especialidades Portoviejo</h1>
                <span class="subt">Área de Emergencia - Atención Médica</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-nav">Sala de Espera</a>
            <a href="triage.html" class="btn-nav">Control de Triage</a>
            <div id="reloj">00:00:00</div>
            <div class="connection-status"><span class="connection-dot" id="connDot"></span><span id="connText">Conectado</span></div>
        </div>
    </header>

    <main class="medico-container">

        <!-- Fila: Pacientes en atención actual -->
        <section class="current-attention-section">
            <div class="section-header">
                <h3>Pacientes en Atención</h3>
                <span class="badge success" id="badgeEnAtencion">0</span>
            </div>
            <div class="cards-row" id="listaEnAtencion">
                <div class="empty-state">No hay pacientes en atención médica</div>
            </div>
        </section>

        <!-- Fila: Pendientes de médico -->
        <section class="pending-section">
            <div class="section-header">
                <h3>Pacientes Pendientes de Atención Médica</h3>
                <span class="badge warning" id="badgePendientesMedico">0</span>
            </div>
            <div class="table-scroll">
                <table class="data-table" id="tablaPendientesMedico">
                    <thead>
                        <tr>
                            <th>Turno</th>
                            <th>Paciente</th>
                            <th>Prioridad</th>
                            <th>Triage por</th>
                            <th>Espera</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="bodyPendientesMedico">
                        <tr><td colspan="6" class="empty-cell">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="sound.js"></script>
    <script src="medico.js"></script>
</body>
</html>
