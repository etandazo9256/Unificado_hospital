<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Emergencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<body class="body-emergencia">
    <div class="form-container-exclusivo card-emergencia">
        <h2>Ingreso a Emergencias</h2>
        <p class="subtitle">Llene únicamente el nombre para pasar a sala de Triaje de inmediato.</p>
        
        <form action="/guardar_emergencia" method="POST">
            <label for="paciente">Nombre Completo del Paciente:</label>
            <input type="text" id="paciente" name="paciente" placeholder="Escriba aquí..." required autofocus>
            
            <button type="submit" class="btn-submit-emergencia">INGRESAR AHORA</button>
            <a href="/" class="btn-volver">
            Volver al Inicio
            </a>
        </form>
    </div>

    {% with messages = get_flashed_messages(category_filter=["emergencia"]) %}
    {% if messages %}
    <script>
        Swal.fire({
            icon: 'warning',
            title: '¡Emergencia Registrada!',
            html: `{{ messages[0] | replace('\n', '<br>') | safe }}`,
            confirmButtonText: 'Aceptar',
            confirmButtonColor: '#d32f2f',
            background: '#ffffff',
            backdrop: 'rgba(211,47,47,0.25)'
        });
    </script>
    {% endif %}
{% endwith %}
</body>
</html>
