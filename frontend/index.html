<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Espera - Hospital de Especialidades Jipijapa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tv-container">
    <header class="tv-topbar">
        <div class="logo-corner">
            <img src="logo-hospital.png" alt="Hospital" class="logo-img">
        </div>
        <div class="info-hospital">
            <h1>Hospital de Especialidades Jipijapa</h1>
            <span class="subt">Sala de Espera - Emergencia</span>
        </div>
        <div class="header-actions">
            <div id="reloj">00:00:00</div>
            <div class="connection-status"><span class="connection-dot" id="connDot"></span><span id="connText">Conectado</span></div>
        </div>
    </header>

    <div class="tv-main">
        <div class="tv-left">
            <div class="call-panel" id="callPanel">
                <div class="call-content" id="callContent">
                    <div class="call-label">TURNO ACTUAL</div>
                    <div class="call-turno" id="callTurno">---</div>
                    <div class="call-paciente" id="callPaciente">Esperando pacientes</div>
                    <div class="call-detalles" id="callDetalles">
                        <span id="callConsultorio"></span>
                        <span id="callPrioridad"></span>
                    </div>
                    <div class="call-hora" id="callHora"></div>
                </div>
                <div class="video-container" id="videoContainer" style="display:none;">
                    <video id="tvVideo" muted playsinline></video>
                </div>
            </div>

            <button class="btn-rellamar" id="btnRellamar" onclick="rellamar()">
            Volver a Llamar
            </button>
        </div>

        <div class="tv-right">
            <div class="right-header">PRÓXIMOS TURNOS</div>
            <div class="proximos-lista" id="proximosLista"></div>
        </div>
    </div>

    <div class="tv-stats" id="tvStats">
        <div class="stat-item"><span class="stat-numero" id="statPendientes">0</span><span class="stat-etiqueta">Pendientes</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-numero" id="statTriage">0</span><span class="stat-etiqueta">En Triage</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-numero" id="statConsulta">0</span><span class="stat-etiqueta">En Consulta</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-numero" id="statAtendidos">0</span><span class="stat-etiqueta">Atendidos</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-numero" id="statPromedio">0</span><span class="stat-etiqueta">Promedio (min)</span></div>
    </div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body>

</html>
